<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Terminal</title>
  <defs>
    <filter id="enz-terminal-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- landscape keyline; window 92 x 72 (18..110 x 28..100); title strip 12 px, buttons on the right; screen inset 6 -->
  <g filter="url(#enz-terminal-drop)">
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#3A404B"/>
  </g>
  <rect x="24" y="40" width="80" height="54" rx="4" fill="#1F2329"/>
  <g fill="#B9C3D3">
    <circle cx="84" cy="34" r="2.5"/>
    <circle cx="92" cy="34" r="2.5"/>
  </g>
  <circle cx="100" cy="34" r="2.5" fill="#FF6B6B"/>
  <path d="M36 54 L48 65 L36 76" fill="none" stroke="#3DDC84" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="73" width="26" height="7" rx="3.5" fill="#3DDC84"/>
</svg>
